[pytest]
testpaths = packages/querydoctor/tests apps/api/tests
pythonpath = packages/querydoctor/tests apps/api
markers =
    integration: requires the Docker lab (target-postgres :5433, bench-postgres :5434, querydoctor-db :5435, redis :6379)
    stack: requires the full Docker stack including the api (:8010) and worker containers
    chaos: failure injection against the live stack (restarts containers); run explicitly with -m chaos
addopts = -q -m "not chaos"
