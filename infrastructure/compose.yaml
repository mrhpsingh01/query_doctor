# QueryDoctor development stack. Run from the repository root:
#   docker compose -f infrastructure/compose.yaml up -d
name: querydoctor

x-postgres-hypopg: &postgres-hypopg
  build:
    context: ./docker
    dockerfile: postgres-hypopg.Dockerfile
  image: querydoctor/postgres-hypopg:16
  command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "max_connections=100"]

services:
  target-postgres:
    <<: *postgres-hypopg
    environment:
      POSTGRES_USER: querydoctor
      POSTGRES_PASSWORD: querydoctor
      POSTGRES_DB: querydoctor_sample
    ports: ["5433:5432"]
    volumes:
      - target-data:/var/lib/postgresql/data
      - ./docker/initdb/target:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querydoctor -d querydoctor_sample"]
      interval: 3s
      timeout: 3s
      retries: 30

  bench-postgres:
    <<: *postgres-hypopg
    environment:
      POSTGRES_USER: querydoctor
      POSTGRES_PASSWORD: querydoctor
      POSTGRES_DB: postgres
    ports: ["5434:5432"]
    volumes:
      - bench-data:/var/lib/postgresql/data
      - ./docker/initdb/bench:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querydoctor -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30

  querydoctor-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: querydoctor
      POSTGRES_PASSWORD: querydoctor
      POSTGRES_DB: querydoctor_meta
    ports: ["5435:5432"]
    volumes:
      - meta-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querydoctor -d querydoctor_meta"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  target-data:
  bench-data:
  meta-data:
