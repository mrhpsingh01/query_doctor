# QueryDoctor development stack. Run from the repository root:
#   docker compose -f infrastructure/compose.yaml up -d
name: querydoctor

x-postgres-hypopg: &postgres-hypopg
  build:
    context: ./docker
    dockerfile: postgres-hypopg.Dockerfile
  image: querydoctor/postgres-hypopg:16
  command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "max_connections=100"]

x-api-build: &api-build
  build:
    context: ..
    dockerfile: infrastructure/docker/api.Dockerfile
  image: querydoctor/api:dev

x-api-env: &api-env
  QD_DATABASE_URL: postgresql+psycopg://querydoctor:querydoctor@querydoctor-db:5432/querydoctor_meta
  QD_TARGET_DSN: postgresql://qd_readonly:qd_readonly@target-postgres:5432/querydoctor_sample
  QD_BENCH_DSN: postgresql://qd_bench:qd_bench@bench-postgres:5432/postgres
  QD_REDIS_URL: redis://redis:6379/0
  QD_SECRET_KEY: ${QD_SECRET_KEY:-}
  QD_SCALE: ${QD_SCALE:-small}
  QD_MODEL_DIR: /models
  QD_OLLAMA_URL: ${QD_OLLAMA_URL:-http://host.docker.internal:11434}
  QD_OLLAMA_MODEL: ${QD_OLLAMA_MODEL:-}  # empty: explanations use the deterministic template only

services:
  target-postgres:
    <<: *postgres-hypopg
    environment:
      POSTGRES_USER: querydoctor
      POSTGRES_PASSWORD: querydoctor
      POSTGRES_DB: querydoctor_sample
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - target-data:/var/lib/postgresql/data
      - ./docker/initdb/target:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querydoctor -d querydoctor_sample"]
      interval: 3s
      timeout: 3s
      retries: 30

  bench-postgres:
    <<: *postgres-hypopg
    environment:
      POSTGRES_USER: querydoctor
      POSTGRES_PASSWORD: querydoctor
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:5434:5432"]
    volumes:
      - bench-data:/var/lib/postgresql/data
      - ./docker/initdb/bench:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querydoctor -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30

  querydoctor-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: querydoctor
      POSTGRES_PASSWORD: querydoctor
      POSTGRES_DB: querydoctor_meta
    ports: ["127.0.0.1:5435:5432"]
    volumes:
      - meta-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querydoctor -d querydoctor_meta"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  seed:
    <<: *api-build
    command:
      - sh
      - -c
      - >-
        python -m querydoctor.lab.seed --if-empty --scale $${QD_SCALE} --with-workload
        --workload-dsn postgresql://qd_readonly:qd_readonly@target-postgres:5432/querydoctor_sample
        --dsn postgresql://querydoctor:querydoctor@target-postgres:5432/querydoctor_sample &&
        python -m querydoctor.lab.seed --if-empty --scale $${QD_SCALE}
        --dsn postgresql://qd_bench:qd_bench@bench-postgres:5432/querydoctor_sample
    environment: *api-env
    depends_on:
      target-postgres: {condition: service_healthy}
      bench-postgres: {condition: service_healthy}
    restart: "no"

  api:
    <<: *api-build
    environment: *api-env
    volumes: ["../models:/models:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:${QD_API_PORT:-8010}:8000"]
    depends_on:
      seed: {condition: service_completed_successfully}
      querydoctor-db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build:
      context: ../apps/web
      dockerfile: ../../infrastructure/docker/web.Dockerfile
      args:
        QD_API_URL: http://api:8000
    image: querydoctor/web:dev
    ports: ["127.0.0.1:${QD_WEB_PORT:-3000}:3000"]
    depends_on:
      api: {condition: service_healthy}

  worker:
    <<: *api-build
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *api-env
    volumes: ["../models:/models:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      seed: {condition: service_completed_successfully}
      querydoctor-db: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  target-data:
  bench-data:
  meta-data:
