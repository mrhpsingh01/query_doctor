[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "querydoctor-api"
version = "0.1.0"
description = "QueryDoctor control plane: FastAPI app and Celery worker"
requires-python = ">=3.12"
dependencies = [
  "querydoctor",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "celery[redis]>=5.4",
  "redis>=5",
  "cryptography>=43",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
